[package]
name = "trace"
version = "2.6.9"
edition = "2021"
rust-version = "1.90"
description = "Architectural memory engine — an MCP server for codebase structure (symbols, call graph, imports, routes), architectural guardrails, decision records and session memory"
license = "MIT"
repository = "https://github.com/ayoubzulfiqar/trace"
readme = "README.md"
keywords = ["mcp", "tree-sitter", "code-intelligence", "architecture", "ai-agents"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "trace"
path = "src/main.rs"

[lib]
name = "trace"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
regex = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.22"
ignore = "0.4"
globset = "0.4"
rayon = "1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
rusqlite = { version = "0.37", features = ["bundled"] }
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# ── Linux packages (see packaging/build-package.sh) ─────────────────────────────

[package.metadata.deb]
maintainer = "Ayoub Zulfiqar <contact@ayoubzulfiqar.com>"
copyright = "2026, Ayoub Zulfiqar <contact@ayoubzulfiqar.com>"
license-file = ["LICENSE", "0"]
extended-description = """\
trace gives AI coding agents structured, always-fresh knowledge of a codebase \
(symbols, call graph, imports and HTTP routes), the project's architectural rules, \
its decision records (ADRs) and a memory of earlier agent sessions, served over \
the Model Context Protocol. Deterministic and offline."""
section = "devel"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/trace", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/trace/README.md", "644"],
    ["docs/USAGE.md", "usr/share/doc/trace/USAGE.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/trace/CHANGELOG.md", "644"],
    ["target/assets/trace.1.gz", "usr/share/man/man1/trace.1.gz", "644"],
    ["target/assets/completions/trace.bash", "usr/share/bash-completion/completions/trace", "644"],
    ["target/assets/completions/_trace", "usr/share/zsh/vendor-completions/_trace", "644"],
    ["target/assets/completions/trace.fish", "usr/share/fish/vendor_completions.d/trace.fish", "644"],
]

[package.metadata.generate-rpm]
summary = "Architectural memory engine and MCP server for AI coding agents"
license = "MIT"
url = "https://github.com/ayoubzulfiqar/trace"
assets = [
    { source = "target/release/trace", dest = "/usr/bin/trace", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/licenses/trace/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/trace/README.md", mode = "644", doc = true },
    { source = "docs/USAGE.md", dest = "/usr/share/doc/trace/USAGE.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/trace/CHANGELOG.md", mode = "644", doc = true },
    { source = "target/assets/trace.1.gz", dest = "/usr/share/man/man1/trace.1.gz", mode = "644", doc = true },
    { source = "target/assets/completions/trace.bash", dest = "/usr/share/bash-completion/completions/trace", mode = "644" },
    { source = "target/assets/completions/_trace", dest = "/usr/share/zsh/site-functions/_trace", mode = "644" },
    { source = "target/assets/completions/trace.fish", dest = "/usr/share/fish/vendor_completions.d/trace.fish", mode = "644" },
]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
