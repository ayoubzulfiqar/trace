[package]
name = "trace"
version = "1.6.9"
edition = "2021"
description = "Architectural Memory Engine — a Rust MCP server for codebase AST indexing, constraint enforcement, ADR graph, and execution memory"
license = "MIT"

[[bin]]
name = "trace"
path = "src/main.rs"

[lib]
name = "trace"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
syn = { version = "2", features = ["full", "visit", "parsing"] }
toml = "0.8"
walkdir = "2"
globset = "0.4"
rayon = "1"
tree-sitter = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-python = "0.20"
tree-sitter-typescript = "0.20"
tree-sitter-javascript = "0.20"
tree-sitter-go = "0.20"
tree-sitter-java = "0.20"
rusqlite = { version = "0.29", features = ["bundled"] }
dirs = "5"
proc-macro2 = { version = "1", features = ["span-locations"] }

[dev-dependencies]
tempfile = "3"
