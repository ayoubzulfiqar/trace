name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish, e.g. v2.6.9"
        required: true

env:
  CARGO_TERM_COLOR: auto
  # Tag pushes use the pushed tag; manual runs must name one (never a branch).
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  build:
    needs: [test]
    name: Build (${{ matrix.os_name }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            os_name: linux
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            os_name: linux
            arch: aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            os_name: windows
            arch: x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build (release)
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}

      - name: Verify binary (Unix)
        if: runner.os != 'Windows'
        run: file "target/${{ matrix.target }}/release/trace"

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar czf "trace-${{ env.RELEASE_TAG }}-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" trace

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "trace-${{ env.RELEASE_TAG }}-${{ matrix.os_name }}-${{ matrix.arch }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/trace.exe" -DestinationPath $name

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "trace-${{ matrix.os_name }}-${{ matrix.arch }}"
          path: |
            trace-*.tar.gz
            trace-*.zip

  build-macos:
    name: Build (macOS, x86_64 + aarch64)
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Build aarch64
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Verify binary (x86_64)
        run: file "target/x86_64-apple-darwin/release/trace"

      - name: Verify binary (aarch64)
        run: file "target/aarch64-apple-darwin/release/trace"

      - name: Package x86_64
        shell: bash
        run: |
          tar czf "trace-${{ env.RELEASE_TAG }}-macos-x86_64.tar.gz" \
            -C "target/x86_64-apple-darwin/release" trace

      - name: Package aarch64
        shell: bash
        run: |
          tar czf "trace-${{ env.RELEASE_TAG }}-macos-aarch64.tar.gz" \
            -C "target/aarch64-apple-darwin/release" trace

      - name: Upload artifact (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: "trace-macos-x86_64"
          path: "trace-*-macos-x86_64.tar.gz"

      - name: Upload artifact (aarch64)
        uses: actions/upload-artifact@v4
        with:
          name: "trace-macos-aarch64"
          path: "trace-*-macos-aarch64.tar.gz"

  # Native packages, each built inside its own distribution so it links
  # against that distribution's libraries and passes its install tooling.
  linux-packages:
    name: Package (${{ matrix.distro }}, ${{ matrix.arch }})
    needs: [test]
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: debian, kind: deb, image: "debian:bookworm", runner: ubuntu-latest, arch: x86_64 }
          - { distro: debian, kind: deb, image: "debian:bookworm", runner: ubuntu-24.04-arm, arch: aarch64 }
          - { distro: fedora, kind: rpm, image: "fedora:latest", runner: ubuntu-latest, arch: x86_64 }
          - { distro: fedora, kind: rpm, image: "fedora:latest", runner: ubuntu-24.04-arm, arch: aarch64 }
          - { distro: arch, kind: arch, image: "archlinux:base-devel", runner: ubuntu-latest, arch: x86_64 }
    steps:
      - name: Install git and tar
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq && apt-get install -y -qq --no-install-recommends git tar ca-certificates >/dev/null
          elif command -v dnf >/dev/null; then
            dnf install -y -q git tar >/dev/null
          else
            pacman -Syu --noconfirm --needed git >/dev/null
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build package
        run: packaging/build-package.sh ${{ matrix.kind }}

      - name: Install and smoke-test the package
        run: |
          case "${{ matrix.kind }}" in
            deb) apt-get install -y ./dist/*.deb ;;
            rpm) dnf install -y ./dist/*.rpm ;;
            arch) pacman -U --noconfirm dist/*.pkg.tar.zst ;;
          esac
          trace --version
          test -f /usr/share/man/man1/trace.1.gz
          test -f /usr/share/bash-completion/completions/trace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "trace-pkg-${{ matrix.distro }}-${{ matrix.arch }}"
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst

  release:
    name: Publish release
    needs: [build, build-macos, linux-packages]
    # A failed distro package must not block the portable binaries.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build-macos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Copy packages and write checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) -exec cp {} release/ \;
          cd release
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          sha256sum $(ls | grep -v '\.sha256$') > SHA256SUMS
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            release/trace-*.tar.gz
            release/trace-*.zip
            release/trace_*.deb
            release/trace-*.rpm
            release/trace-*.pkg.tar.zst
            release/*.sha256
            release/SHA256SUMS
          fail_on_unmatched_files: false
