name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: auto

jobs:
  build:
    name: Build (${{ matrix.os_name }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            os_name: linux
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            os_name: linux
            arch: aarch64
          - target: x86_64-apple-darwin
            runner: macos-13
            os_name: macos
            arch: x86_64
          - target: aarch64-apple-darwin
            runner: macos-14
            os_name: macos
            arch: aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            os_name: windows
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}

      - name: Verify binary (Unix)
        if: runner.os != 'Windows'
        run: file "target/${{ matrix.target }}/release/trace"

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar czf "trace-${{ github.ref_name }}-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" trace

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "trace-${{ github.ref_name }}-${{ matrix.os_name }}-${{ matrix.arch }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/trace.exe" -DestinationPath $name

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "trace-${{ matrix.os_name }}-${{ matrix.arch }}"
          path: |
            trace-*.tar.gz
            trace-*.zip

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Copy packages
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/trace-*.tar.gz
            release/trace-*.zip
          fail_on_unmatched_files: false
